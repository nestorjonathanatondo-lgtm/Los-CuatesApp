  function save(){localStorage.setItem(KEY,JSON.stringify(state));applyAssets()}
  function open(){const pass=prompt('Contraseña de administrador:');if(pass!==state.password)return;document.getElementById('cuates-admin').showModal()}
  function trigger(){let el=document.querySelector('.admin-yellow-trigger,[data-admin-trigger]');if(!el){el=document.createElement('button');el.setAttribute('aria-label','Administración');el.style='position:fixed;bottom:18px;left:50%;width:42px;height:42px;opacity:.03;z-index:9999;border:0;background:transparent';document.body.appendChild(el)}const tap=()=>{const n=Date.now();taps=n-last<500?taps+1:1;last=n;clearTimeout(timer);timer=setTimeout(()=>taps=0,1600)};el.addEventListener('click',tap);el.addEventListener('mousedown',()=>{if(taps>=3)timer=setTimeout(open,900)});el.addEventListener('mouseup',()=>clearTimeout(timer));el.addEventListener('touchstart',()=>{if(taps>=3)timer=setTimeout(open,900)},{passive:true});el.addEventListener('touchend',()=>clearTimeout(timer),{passive:true})}
  function panel(){const d=document.createElement('dialog');d.id='cuates-admin';d.innerHTML='<form method="dialog" style="font:14px system-ui;min-width:300px;max-width:92vw;padding:20px"><h2>Administración</h2><label>Logo Los Cuates <input id="aCuatesLogo" placeholder="URL o ruta"></label><br><label>Mostrar logo Cuates <input id="aShowCuates" type="checkbox"></label><br><label>Logo JM Design <input id="aJmLogo" placeholder="URL o ruta"></label><br><label>Mostrar logo JM <input id="aShowJM" type="checkbox"></label><br><label>Carita queso <input id="aQueso"></label><br><label>Carita chile <input id="aChile"></label><br><label>Carita verde <input id="aTomatillo"></label><br><button id="aSave" value="default">Guardar cambios</button> <button value="cancel">Cerrar</button></form>';document.body.appendChild(d);set('aCuatesLogo',state.cuatesLogo);set('aJmLogo',state.jmLogo);set('aQueso',state.queso);set('aChile',state.chile);set('aTomatillo',state.tomatillo);aShowCuates.checked=state.showCuates;aShowJM.checked=state.showJM;aSave.onclick=()=>{state.cuatesLogo=aCuatesLogo.value||state.cuatesLogo;state.jmLogo=aJmLogo.value||state.jmLogo;state.queso=aQueso.value||state.queso;state.chile=aChile.value||state.chile;state.tomatillo=aTomatillo.value||state.tomatillo;state.showCuates=aShowCuates.checked;state.showJM=aShowJM.checked;save()}}
  function boot(){panel();applyAssets();trigger()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0)
})();
</script>
</body>
</html>
